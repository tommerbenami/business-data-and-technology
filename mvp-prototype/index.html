<title>אב־טיפוס חיבור עסקים ומשקיעים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a phone-sized app on the right, a presenter side panel (funnel, scope) on the left. Stacks on mobile. */
:root{
  --bg:#E9EFEC; --phone:#F6F9F8; --surface:#FFFFFF; --surface2:#EDF3F1; --ink:#12201C; --muted:#586966; --line:#D3DDDA;
  --accent:#0C6A58; --accent-ink:#FFFFFF; --accent-soft:#D9EFE8;
  --warn:#8A5200; --warn-soft:#FAEBCF; --bad:#B0342A; --bad-soft:#F7DEDA; --good:#17703A; --good-soft:#D9EFE0;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 10px 30px rgba(18,32,28,.10);
  --font:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --phone:#111B18; --surface:#18241F; --surface2:#1F2E29; --ink:#E6F0EC; --muted:#9DB0AA; --line:#2B3C36;
  --accent:#3FC0A4; --accent-ink:#06201A; --accent-soft:#173A32;
  --warn:#F0B35A; --warn-soft:#3A2B10; --bad:#F08A80; --bad-soft:#3C1A17; --good:#6FD598; --good-soft:#143323;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --phone:#111B18; --surface:#18241F; --surface2:#1F2E29; --ink:#E6F0EC; --muted:#9DB0AA; --line:#2B3C36;
  --accent:#3FC0A4; --accent-ink:#06201A; --accent-soft:#173A32;
  --warn:#F0B35A; --warn-soft:#3A2B10; --bad:#F08A80; --bad-soft:#3C1A17; --good:#6FD598; --good-soft:#143323;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:20px;font-weight:800;text-wrap:balance}
h2{font-size:17px;font-weight:700;text-wrap:balance}
h3{font-size:14px;font-weight:700}
.wrap{max-width:1020px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.top .sub{color:var(--muted);font-size:13px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.phone{position:relative;height:790px;display:flex;flex-direction:column;background:var(--phone);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;max-width:100%}
@media (max-width:560px){.phone{height:calc(100dvh - 120px);min-height:560px;border-radius:18px}}
.ph-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.ph-head h2{font-size:16px}
.demo-banner{background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;padding:5px 16px;text-align:center}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:11px 4px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;inset-inline:22%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;margin-inline-start:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flat{background:var(--surface2);border-color:transparent}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:0}
.row.wrap2{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;text-align:center;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.demo{border-style:dashed;color:var(--muted);font-weight:500;font-size:13px;min-height:36px;padding:7px 10px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 0;min-height:0;text-align:start}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tabs button:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>.btn{flex:1 1 120px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:9px 11px;min-height:40px}
textarea{resize:vertical;min-height:64px}
input.err{border-color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.req{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
button.chip{border:1px solid var(--line);cursor:pointer;padding:5px 12px}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.notice{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--surface2)}
.notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.bad{background:var(--bad-soft);color:var(--bad)} .notice.ok{background:var(--good-soft);color:var(--good)} .notice.acc{background:var(--accent-soft);color:var(--accent)}
.meter{display:flex;gap:3px;direction:ltr}
.meter i{flex:1;height:8px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--accent)}
.score{display:flex;align-items:baseline;gap:6px}.score b{font-size:26px;line-height:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface2);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.stat b{font-size:14px;color:var(--ink);font-weight:700}
.nodata{font-style:normal;font-weight:500;color:var(--muted)}
.ask{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ask div{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 10px;font-size:12px}
.ask b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.deck{position:relative;min-height:470px;touch-action:pan-y}
.swc{position:absolute;inset:0 0 auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);cursor:grab;user-select:none;transition:transform .18s ease;will-change:transform}
.swc.drag{transition:none;cursor:grabbing}
.swc .tag{position:absolute;top:14px;padding:3px 12px;border:2px solid;border-radius:8px;font-weight:800;opacity:0;pointer-events:none}
.swc .tag.l{left:14px;color:var(--good);transform:rotate(-8deg)} .swc .tag.p{right:14px;color:var(--bad);transform:rotate(8deg)}
.deckbtns{display:flex;gap:18px;justify-content:center;direction:ltr;margin-top:6px}
.round{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:22px;cursor:pointer;font-weight:700}
.round.yes{color:var(--good);border-color:var(--good)} .round.no{color:var(--bad);border-color:var(--bad)}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
.scroll-x{overflow-x:auto}
.steps{display:flex;gap:4px}
.steps div{flex:1;text-align:center;font-size:11px;color:var(--muted);border-top:3px solid var(--line);padding-top:4px}
.steps div.done{border-color:var(--accent);color:var(--accent);font-weight:700}
.bubble{border-radius:12px;padding:8px 11px;font-size:13px;max-width:92%;background:var(--surface2)}
.bubble.biz{background:var(--accent-soft);align-self:flex-start}.bubble.inv{align-self:flex-end}
.bubble small{display:block;color:var(--muted);font-size:11px}
.funnel{display:flex;flex-direction:column;gap:8px}
.fbar{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;align-items:center;font-size:13px}
.fbar span.t{height:14px;border-radius:4px;background:var(--surface2);position:relative;overflow:hidden}
.fbar span.t i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px;direction:ltr}
html[dir=rtl] .fbar span.t i{inset:0 0 0 auto}
.fbar b{font-variant-numeric:tabular-nums;text-align:end}
.toast{position:absolute;inset-inline:16px;bottom:70px;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;text-align:center;z-index:5}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
details summary{cursor:pointer;font-weight:700}
ul.clean{margin:6px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:3px}
.sig{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface2)}
.big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
/* "It's a Match!" overlay, shown over the phone once per deal when the business owner approves a match */
.match{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;
  background:radial-gradient(circle at 50% 38%,rgba(12,106,88,.55),rgba(6,18,15,.9) 70%);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;overflow:hidden;animation:mFade .25s ease both}
.m-confs{position:absolute;inset:0;pointer-events:none}
.m-conf{position:absolute;top:-16px;left:var(--x);width:8px;height:14px;border-radius:2px;background:var(--c);opacity:0;animation:mConfetti var(--d) cubic-bezier(.25,.6,.45,1) var(--w) both}
.m-pair{display:flex;align-items:center;position:relative}
.m-av{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:800;border:4px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.m-av.biz{background:var(--accent);color:var(--accent-ink);animation:mSlideR .55s cubic-bezier(.2,1.3,.4,1) .1s both}
.m-av.inv{background:#fff;color:#0C6A58;animation:mSlideL .55s cubic-bezier(.2,1.3,.4,1) .1s both}
.m-heart{position:relative;z-index:1;width:46px;height:46px;margin-inline:-14px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff;font-size:22px;font-weight:800;border:3px solid #fff;box-shadow:0 0 0 0 rgba(111,213,152,.6);animation:mIn .3s ease .55s both,mPulse 1.4s ease-out .85s 2}
.m-title{font-size:46px;line-height:1.05;font-weight:800;letter-spacing:-.5px;text-wrap:balance;
  background:linear-gradient(110deg,#fff 42%,#9FE8D2 50%,#fff 58%);background-size:260% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(63,192,164,.55));animation:mPop .6s cubic-bezier(.2,1.6,.4,1) .3s both,mShine 1.3s ease .95s both}
.m-sub b{white-space:nowrap;color:#fff}
.m-sub{max-width:300px;font-size:15px;color:rgba(255,255,255,.88);animation:mIn .4s ease .75s both}
.m-btns{display:flex;flex-direction:column;gap:8px;width:100%;max-width:280px;margin-top:4px;animation:mIn .4s ease .9s both}
.m-btns .btn{width:100%}
.match .btn.m-later{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.match .btn:focus-visible{outline-color:#fff}
@keyframes mFade{from{opacity:0}}
@keyframes mIn{from{opacity:0;transform:translateY(10px) scale(.9)}}
@keyframes mPop{0%{opacity:0;transform:scale(.4) rotate(-6deg)}100%{opacity:1;transform:none}}
@keyframes mShine{from{background-position:100% 0}to{background-position:0 0}}
@keyframes mSlideR{from{opacity:0;transform:translateX(140px) rotate(20deg)}}
@keyframes mSlideL{from{opacity:0;transform:translateX(-140px) rotate(-20deg)}}
@keyframes mPulse{0%{box-shadow:0 0 0 0 rgba(111,213,152,.65);transform:scale(1)}30%{transform:scale(1.15)}100%{box-shadow:0 0 0 22px rgba(111,213,152,0);transform:scale(1)}}
@keyframes mConfetti{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:.9;transform:translate(var(--dx),860px) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.swc{transition:none}.match,.match *{animation:none!important}.m-conf{display:none}.m-title{background-position:0 0}}
#rain{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
</style>

<div class="wrap">
  <div class="top">

  </div>
  <div class="grid">
    <div class="phone" id="phone"></div>
    <aside class="side" id="side"></aside>
  </div>
</div>

function showMatch(d,onGo){

  const b=bizById(d.bizId),i=invById(d.invId),ini=s=>esc(String(s||'').trim().charAt(0)||'?');
  const cols=['#3FC0A4','#6FD598','#E0A82E','#FFFFFF','#9FE8D2','#F08A80'],rnd=(a,z)=>a+Math.random()*(z-a);
  const conf=Array.from({length:24},(_,k)=>`<i class="m-conf" style="--x:${rnd(2,98).toFixed(1)}%;--dx:${Math.round(rnd(-60,60))}px;--d:${rnd(1.6,2.6).toFixed(2)}s;--w:${rnd(.2,.8).toFixed(2)}s;--r:${Math.round(rnd(360,900))*(k%2?1:-1)}deg;--c:${cols[k%cols.length]}"></i>`).join('');

  m.className='match';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-labelledby','mTitle');m.setAttribute('aria-describedby','mSub');
  m.innerHTML=`<div class="m-confs" aria-hidden="true">${conf}</div>
   <div class="m-pair" aria-hidden="true"><span class="m-av biz">${ini(b.name)}</span><span class="m-heart">✓</span><span class="m-av inv">${ini(i.name)}</span></div>

   <p id="mSub" class="m-sub">נוצרה התאמה בין <b>${esc(b.name)}</b> <b>ל־${esc(i.name)}</b>. נפתח חלון משא ומתן.</p>
   <div class="m-btns"><button type="button" class="btn pri" data-m="go">למשא ומתן</button><button type="button" class="btn m-later" data-m="close">אחר כך</button></div>`;
  m.addEventListener('click',e=>{const t=e.target.closest('[data-m]');if(!t)return;m.remove();if(t.dataset.m==='go'&&onGo)onGo()});
  m.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();m.remove();return}

}

function dollarRain(){
  try{
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const old=document.getElementById('rain');if(old)old.remove();
    const c=document.createElement('canvas');c.id='rain';c.setAttribute('aria-hidden','true');document.body.appendChild(c);
    const dpr=window.devicePixelRatio||1,W=window.innerWidth,H=window.innerHeight;
    c.width=W*dpr;c.height=H*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);
    const pieces=Array.from({length:70},()=>({
      x:Math.random()*W,y:-30-Math.random()*H*0.8,vy:2.2+Math.random()*3,vx:(Math.random()-.5)*1.2,
      rot:Math.random()*6.28,vr:(Math.random()-.5)*.12,coin:Math.random()<.3,s:20+Math.random()*14}));
    const t0=performance.now();
    (function frame(t){
      g.clearRect(0,0,W,H);let alive=0;
      for(const p of pieces){
        p.y+=p.vy;p.x+=p.vx+Math.sin((t+p.s*90)/400)*.6;p.rot+=p.vr;
        if(p.y<H+40)alive++;
        g.save();g.translate(p.x,p.y);g.rotate(p.rot);
        if(p.coin){g.fillStyle='#E0A82E';g.beginPath();g.arc(0,0,p.s*.45,0,6.28);g.fill();g.strokeStyle='#8A5F0A';g.lineWidth=1.5;g.stroke();g.fillStyle='#6B4806'}
        else{g.fillStyle='#2E8B57';g.fillRect(-p.s,-p.s*.5,p.s*2,p.s);g.strokeStyle='#14532D';g.lineWidth=1.5;g.strokeRect(-p.s,-p.s*.5,p.s*2,p.s);g.fillStyle='#E7F6EC'}
        g.font='700 '+Math.round(p.s*(p.coin?.6:.8))+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('$',0,1);
        g.restore();
      }
      if(alive&&t-t0<5000)requestAnimationFrame(frame);else c.remove();
    })(t0);
  }catch(e){}
}

function feedList(){
  const v=S.inv,min=num(v.min),max=num(v.max),pmin=num(v.pmin),pmax=num(v.pmax);
  const all=allBiz().filter(b=>!S.swipes[b.id]);
  const ok=all.filter(b=>b.amount>=min&&b.amount<=max&&b.pct>=pmin&&b.pct<=pmax&&(!v.sectors.length||v.sectors.includes(b.sector)));
  return{ok,hidden:all.length-ok.length};
}
function swipeTop(dir,card){
  const list=feedList().ok;if(!list.length)return;
  const b=list[0],el=card||document.querySelector('.swc');
  if(el){el.style.transition='transform .22s ease';el.style.transform=`translateX(${dir==='like'?'':'-'}480px) rotate(${dir==='like'?14:-14}deg)`}
  setTimeout(()=>{
    S.swipes[b.id]=dir;
    if(dir==='like'){const d=newDeal(b.id,'meInv',b.amount,b.pct);toast(b.mine?'הבעת עניין בעסק שלך. עברו לתצוגת בעל העסק':`הבעת עניין ב־${b.name}`);void d}
    keepScroll=false;render();
  },200);
}
function wireSwipe(){
  const el=document.querySelector('.swc');if(!el)return;
  let x0=null,dx=0;
  el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;x0=e.clientX;dx=0;el.classList.add('drag');el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{
    if(x0==null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    el.querySelector('.tag.l').style.opacity=Math.max(0,Math.min(1,dx/90));el.querySelector('.tag.p').style.opacity=Math.max(0,Math.min(1,-dx/90));
  });
  const end=()=>{
    if(x0==null)return;x0=null;el.classList.remove('drag');
    if(Math.abs(dx)>90)swipeTop(dx>0?'like':'pass',el);
    else{el.style.transform='';el.querySelector('.tag.l').style.opacity=0;el.querySelector('.tag.p').style.opacity=0}
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

/* ---------- views ---------- */
function onboardView(){
  const isBiz=S.role==='biz',o=isBiz?S.biz:S.inv;
  if(isBiz&&S.biz.onb===1){
    return{title:'מסמכי עסק (שלב 2 מתוך 2)',body:`
      <div class="notice acc">הצוות מאמת ידנית כל עסק לפני שהוא נחשף למשקיעים. אפשר להשלים אחר כך ולשמור טיוטה.</div>
      ${docRow('מסמך רישום עסק','reg')}${docRow('חשבונית אחרונה','inv')}
      <button class="btn pri" data-act="onbNext">המשך לפרופיל העסק</button>`};
  }
  return{title:`הרשמה וזיהוי${isBiz?' (שלב 1 מתוך 2)':''}`,body:`
    <div class="notice warn">שדות זיהוי (KYC) הם דמו בלבד. אל תזינו פרטים אמיתיים.</div>
    ${field('שם מלא','kyc-name',(isBiz?'biz':'inv')+'.fname',o.fname,{req:1})}
    ${field('מספר זהות (דמו)','kyc-id',(isBiz?'biz':'inv')+'.idn',o.idn,{hint:'אין בדיקת תקינות בדמו',num:1})}
    <div class="btns"><button class="btn demo" data-act="onbDemo">מלא נתוני דמו</button><button class="btn pri" data-act="onbNext">המשך</button></div>
    <p class="small muted">ההרשמה חינמית. העמלה (0.8%) נגבית מבעל העסק רק כשעסקה נסגרת.</p>`};
}
function docRow(label,k){
  const v=S.biz[k];
  return`<div class="card"><div class="row"><b>${label}</b>${v?chip('הועלה','ok'):chip('חסר','warn')}</div>
   <div class="small muted num">${v?esc(v):'לא נבחר קובץ'}</div>
   <div class="btns"><label class="btn" style="cursor:pointer">בחירת קובץ<input type="file" data-file="${k}" style="display:none"></label><button class="btn demo" data-act="docDemo" data-arg="${k}">קובץ לדוגמה</button></div></div>`;
}

function bizProfileView(){
  const b=S.biz,p=b.p,sc=bizScore();
  const ready=p.amount&&p.purpose&&p.pct&&b.reg&&b.inv&&p.name;
  let banner;
  if(!b.published)banner=`<div class="notice">טיוטה. ממלאים את שדות החובה, מעלים מסמכים ושולחים לאימות.</div>`;
  else if(!b.verified)banner=`<div class="notice warn">ממתין לאימות הצוות (עד 48 שעות עבודה). רק אחרי אימות העסק נחשף למשקיעים.</div><button class="btn demo" data-act="verify">דמו: הצוות מאשר את העסק</button>`;
  else banner=`<div class="notice ok">העסק מאומת וחשוף למשקיעים.</div>`;
  return{title:'פרופיל העסק',body:`${banner}
   <div class="card"><div class="row"><h3>מדד שלמות פרופיל</h3><div class="score"><b class="num">${sc.score}</b><span class="muted">/10</span></div></div>${meter(sc.score)}
    <div class="small muted">מילוי ${sc.fill}% · ${b.verified?'מאומת':'לא מאומת'}. המדד מראה כמה הפרופיל מלא ומאומת. הוא לא מעיד על כדאיות ההשקעה ואינו ייעוץ השקעות או דירוג אשראי.</div></div>
   <div class="card">
    ${field('שם העסק','p-name','biz.p.name',p.name,{req:1})}
    <label class="f">תחום<select id="p-sector" data-b="biz.p.sector">${SECTORS.map(s=>`<option ${s===p.sector?'selected':''}>${s}</option>`).join('')}</select></label>
    ${field('מחזור שנתי משוער (₪)','p-turn','biz.p.turnover',p.turnover,{num:1})}
    <div class="two">${field('סכום מבוקש (₪)','p-amt','biz.p.amount',p.amount,{req:1,num:1})}${field('אחוז מהרווח שמקובל','p-pct','biz.p.pct',p.pct,{req:1,num:1})}</div>
    ${field('למה הכסף','p-purpose','biz.p.purpose',p.purpose,{req:1})}
    ${field('תיאור העסק','p-desc','biz.p.desc',p.desc,{area:1})}
    ${field('חוזקות','p-str','biz.p.strengths',p.strengths)}
   </div>
   ${docRow('מסמך רישום עסק','reg')}${docRow('חשבונית אחרונה','inv')}
   <div class="btns"><button class="btn demo" data-act="fillBiz">מלא נתוני דוגמה</button><button class="btn" data-act="saveDraft">שמור טיוטה</button>
   ${b.published?'':`<button class="btn pri" data-act="publish" ${ready?'':'disabled'}>שלח לאימות</button>`}</div>
   ${!b.published&&!ready?'<p class="tiny muted">לשליחה נדרשים שם, סכום, ייעוד, אחוז ושני מסמכים.</p>':''}`};
}

function leadsView(){
  const ls=myDeals('biz').filter(d=>d.status==='interested');
  if(!S.biz.verified)return{title:'מתעניינים',body:`<div class="notice">אחרי שהעסק יאומת יופיעו כאן משקיעים שהביעו עניין. עברו לטאב הפרופיל ושלחו לאימות.</div>`};
  return{title:'מתעניינים',body:ls.length?ls.map(d=>{const i=invById(d.invId);return`<div class="card">
    <div class="row"><b>${esc(i.name)}</b>${chip('KYC אושר','ok')}</div>
    <div class="small muted">${esc(i.hood)} · ${esc(i.strengths)}</div>
    <div class="ask"><div>הציע סכום<b>${fmt(d.prop.amount)}</b></div><div>תמורת<b>${d.prop.pct}%</b></div></div>
    <div class="btns"><button class="btn bad" data-act="reject" data-arg="${d.id}">דחה</button><button class="btn pri" data-act="approve" data-arg="${d.id}">אשר והתחל משא ומתן</button></div></div>`}).join('')
   :`<div class="notice">אין כרגע מתעניינים חדשים.</div>`+`<p class="small muted">משקיע אחד לעסקה. פיצול הסכום בין כמה משקיעים נדחה לגרסה הבאה.</p>`};
}
function dealsListView(role){
  const ls=myDeals(role).filter(d=>role==='inv'||d.status!=='interested');
  return{title:role==='biz'?'העסקאות שלי':'ההשקעות והעניין שלי',body:ls.length?ls.map(d=>`
   <button class="card" style="text-align:start;cursor:pointer" data-act="open" data-arg="${d.id}">
    <div class="row"><b>${esc(cpName(d,role))}</b>${stBadge(d)}</div>
    <div class="small muted num">${fmt((d.terms||d.prop||{amount:0}).amount)} · ${(d.terms||d.prop||{pct:0}).pct}% מהרווח החוזי</div></button>`).join('')
   :`<div class="notice">${role==='inv'?'עדיין אין עסקאות. גללו בפיד והביעו עניין בעסק.':'עדיין אין עסקאות. אשרו מתעניין בטאב המתעניינים.'}</div>`};
}

function invProfileView(){
  const v=S.inv;
  return{title:'פרופיל המשקיע',body:`
   <div class="card">
    <div class="two">${field('סכום מינימום (₪)','i-min','inv.min',v.min,{num:1})}${field('סכום מקסימום (₪)','i-max','inv.max',v.max,{num:1})}</div>
    <div class="two">${field('אחוז מקובל, מינימום','i-pmin','inv.pmin',v.pmin,{num:1})}${field('אחוז מקובל, מקסימום','i-pmax','inv.pmax',v.pmax,{num:1})}</div>
    <div><div class="small" style="font-weight:600;margin-bottom:6px">תחומים (ריק = הכול)</div><div class="btns" style="gap:6px">${SECTORS.map(s=>`<button class="chip" style="flex:0 0 auto" aria-pressed="${v.sectors.includes(s)}" data-act="sector" data-arg="${s}">${s}</button>`).join('')}</div></div>
    ${field('החוזקות שלי','i-str','inv.strengths',v.strengths,{hint:'למשל ניסיון בעסקים, ידע חשבונאי'})}
   </div>
   <div class="notice acc">הפיד מציג רק עסקים בתוך הסכום והאחוז שהגדרתם. ההשקעה היא בעסק כולו, תמורת אחוז קבוע מהרווח השנתי, בלי בעלות.</div>`};
}

function feedView(){
  const{ok,hidden}=feedList(),v=S.inv;
  const head=`<div class="row small muted"><span>טווח: ${fmt(num(v.min))}–${fmt(num(v.max))} · ${v.pmin}–${v.pmax}%</span><span>${hidden?`${hidden} עסקים מחוץ לטווח`:''}</span></div>`;
  if(!ok.length)return{title:'גילוי עסקים',body:`${head}<div class="notice">אין עוד עסקים שמתאימים לטווחים שלכם. אפשר להרחיב את הטווח בפרופיל.</div>`};
  const b=ok[0];
  return{title:'גילוי עסקים',body:`${head}
  <div class="deck"><div class="swc" role="group" aria-label="כרטיס עסק">
    <span class="tag l">מעוניין</span><span class="tag p">דלג</span>
    <div class="row"><div style="display:flex;gap:10px;align-items:center;min-width:0"><div class="avatar" aria-hidden="true">${esc(b.name[0])}</div><div style="min-width:0"><h2>${esc(b.name)}</h2><div class="small muted">${esc(b.sector)} · ${esc(b.hood)}</div></div></div>
      <div style="text-align:center"><div class="score"><b class="num">${b.score}</b><span class="muted">/10</span></div><div class="tiny muted">שלמות פרופיל</div></div></div>
    ${meter(b.score)}
    <div class="ask"><div>מבקש<b>${fmt(b.amount)}</b></div><div>מציע מהרווח החוזי<b>${b.pct}% </b></div></div>
    <div class="small"><b>ייעוד:</b> ${esc(b.purpose||'פתוח')}</div>
    <div class="small muted">${esc(b.desc)}</div>
    <div class="small"><b>חוזקות:</b> ${esc(b.strengths)}</div>
    <div class="tiny muted" style="margin-top:2px">מידע שהעסק בחר להציג על עצמו. מחזור שנתי משוער: ${b.turnover?fmt(b.turnover):'לא צוין'}</div>
    <div class="stats">${stat('עסקאות מוצלחות',b.stats.deals)}${stat('משקיעים מרוצים',b.stats.happy)}${stat('זמן באפליקציה',b.stats.months,' חודשים')}${stat('טווחי השקעה',b.stats.range)}</div>
    <div class="tiny muted">המדד אינו ייעוץ השקעות ואינו דירוג אשראי. השקעה בעסק עלולה לאבד את כולה.</div>
  </div></div>
  <div class="deckbtns"><button class="round no" aria-label="דלג" data-act="swipe" data-arg="pass">✕</button><button class="round yes" aria-label="מעוניין" data-act="swipe" data-arg="like">✓</button></div>
  <p class="tiny muted" style="text-align:center">אפשר גם לגרור את הכרטיס ימינה (מעוניין) או שמאלה (דלג)</p>`};
}

/* ----- deal screen ----- */
function dealView(d){
  const role=S.role,idx={interested:0,negotiating:1,contract:2,signed:3,closed:4}[d.status];
  const labels=['התאמה','משא ומתן','חוזה','הפקדה','פעילה'];
  const steps=idx==null?'':`<div class="steps">${labels.map((l,i)=>`<div class="${i<=idx?'done':''}">${l}</div>`).join('')}</div>`;
  const head=`<div class="row"><button class="btn link" data-act="back">‹ חזרה</button>${stBadge(d)}</div>
    <div><h2>${esc(cpName(d,role))}</h2><div class="small muted">${role==='biz'?'משקיע':'עסק'} · עסקה #${d.id}</div></div>${steps}`;
  let body='';
  if(d.status==='interested')body=interestedBody(d,role);
  else if(d.status==='negotiating')body=negBody(d,role);
  else if(d.status==='contract')body=contractBody(d,role);
  else if(d.status==='signed')body=payBody(d,role);
  else if(d.status==='closed')body=closedBody(d,role);
  else body=`<div class="notice bad">${d.status==='rejected'?'בעל העסק דחה את ההתאמה.':'לא הושגה הסכמה בחלון המשא ומתן והצדדים חזרו להתאמה.'}</div>`;
  const log=d.log.length?`<details><summary class="small">יומן העסקה (${d.log.length})</summary><div class="stack" style="margin-top:8px">${d.log.map(l=>`<div class="bubble ${l.by}"><small>${RL[l.by]}</small>${esc(l.text)}</div>`).join('')}</div></details>`:'';
  return{title:'עסקה',body:head+body+log};
}
function interestedBody(d,role){
  const p=d.prop;
  return`<div class="card"><h3>הצעת פתיחה של המשקיע</h3><div class="ask"><div>סכום<b>${fmt(p.amount)}</b></div><div>אחוז מהרווח החוזי<b>${p.pct}%</b></div></div></div>
   ${role==='biz'?`<div class="btns"><button class="btn bad" data-act="reject" data-arg="${d.id}">דחה</button><button class="btn pri" data-act="approve" data-arg="${d.id}">אשר התאמה</button></div>`
   :`<div class="notice warn">ההתאמה מתממשת כשבעל העסק מאשר. המשקיע אינו משלם עד חתימה והפקדה.</div><button class="btn demo" data-act="demoApprove" data-arg="${d.id}">דמו: בעל העסק מאשר</button>`}`;
}
function negBody(d,role){
  const p=d.prop,n=S.nf,termErr=n.term!==''&&(num(n.term)>MAXTERM||num(n.term)<1);
  const mine=p&&p.by===role;
  return`<div class="card"><h3>ההצעה הנוכחית (${p?`מ${RL[p.by]}`:''})</h3>
    <div class="stats"><div class="stat"><span>סכום</span><b class="num">${fmt(p.amount)}</b></div><div class="stat"><span>אחוז מהרווח</span><b class="num">${p.pct}%</b></div><div class="stat"><span>תקופה</span><b class="num">${p.term} שנים</b></div><div class="stat"><span>תקרת הפלטפורמה</span><b>${MAXTERM} שנים</b></div></div>
    ${mine?`<div class="notice">ממתין לתשובת הצד השני.</div><button class="btn demo" data-act="demoAccept">דמו: ${RL[other(role)]} מאשר את התנאים</button>`
         :`<button class="btn pri" data-act="accept">אשר את התנאים</button>`}</div>
   <div class="card"><h3>הצעה נגדית</h3>
    <div class="two">${field('סכום (₪)','n-amt','nf.amount',n.amount,{num:1})}${field('אחוז מהרווח','n-pct','nf.pct',n.pct,{num:1})}</div>
    ${field('תקופה (שנים)','n-term','nf.term',n.term,{num:1,err:termErr,hint:`עד ${MAXTERM} שנים`})}
    ${termErr?`<div class="notice bad">התקופה חייבת להיות בין שנה ל־${MAXTERM} שנים.</div>`:''}
    <button class="btn pri" data-act="propose" ${termErr?'disabled':''}>שלח הצעה</button></div>
   <button class="btn bad" data-act="noagree">אין הסכמה, חזרה להתאמה</button>`;
}
function contractBody(d,role){
  const c=d.c,t=d.terms,locked=c.sigbiz||c.siginv,miss=[];
  if(!(t.term>=1&&t.term<=MAXTERM))miss.push('תקופה (עד 10 שנים)');
  if(!c.purpose.trim())miss.push('ייעוד הכסף');
  if(c.closure==='agreed'&&!c.closureText.trim())miss.push('הסדר פיצוי בסגירת העסק');
  const needRisk=role==='inv'&&!c.riskAck;
  const canSign=!miss.length&&!needRisk&&!c['sig'+role];
  const termStr=String(t.term);
  return`<div class="card"><h3>חוזה אחיד: שדות חובה</h3><div class="scroll-x"><table>
   <tr><th>שדה</th><th>ערך</th></tr>
   <tr><td>סכום ההשקעה</td><td class="num"><b>${fmt(t.amount)}</b></td></tr>
   <tr><td>אחוז מהרווח השנתי</td><td class="num"><b>${t.pct}%</b></td></tr>
   <tr><td>תקופה (עד ${MAXTERM} שנים)</td><td><input type="text" id="c-term" inputmode="numeric" data-b="d:${d.id}.terms.term" value="${esc(termStr)}" ${locked?'disabled':''} class="${miss.includes('תקופה (עד 10 שנים)')?'err':''}" style="width:90px"></td></tr>
   <tr><td>ייעוד הכסף</td><td><input type="text" id="c-purpose" data-b="d:${d.id}.c.purpose" value="${esc(c.purpose)}" ${locked?'disabled':''} class="${c.purpose.trim()?'':'err'}"></td></tr>
   <tr><td>תדירות דיווח</td><td><select id="c-freq" data-b="d:${d.id}.c.freq" ${locked?'disabled':''}>${['שנתי','חצי שנתי','רבעוני'].map(f=>`<option ${f===c.freq?'selected':''}>${f}</option>`).join('')}</select><div class="tiny muted">ברירת מחדל שנתי. דוחות ביניים נועדו למידע, הרווח החוזי נקבע לפי הדוח השנתי.</div></td></tr>
   <tr><td>מדידת הרווח</td><td class="small">רווח חוזי: רווח לפני מס לפי הדוח שהוגש לרשות המסים ואושר על ידי רו״ח או יועץ מס, בתוספת שכר בעלים מעל המוסכם, הוצאות פרטיות, תשלומים לצדדים קשורים מעל מחיר שוק והחזרי הלוואות בעלים. (חלק קבוע בתבנית)</td></tr>
   <tr><td>זכות ביקורת</td><td class="small">המשקיע רשאי לדרוש בדיקת רו״ח מטעמו. פער מעל ${AUDIT_GAP}% מחייב את העסק בעלות הבדיקה. (חלק קבוע בתבנית)</td></tr>
   <tr><td>סגירה או הפסד של העסק</td><td><select id="c-clo" data-b="d:${d.id}.c.closure" ${locked?'disabled':''}><option value="none" ${c.closure==='none'?'selected':''}>אין פיצוי למשקיע</option><option value="agreed" ${c.closure==='agreed'?'selected':''}>הסדר אחר שהוסכם</option></select>
     ${c.closure==='agreed'?`<input type="text" id="c-clot" data-b="d:${d.id}.c.closureText" value="${esc(c.closureText)}" placeholder="פרטו את ההסדר" ${locked?'disabled':''} style="margin-top:6px">`:''}</td></tr>
  </table></div>
  ${miss.length?`<div class="notice bad">אי אפשר לחתום. שדות חובה חסרים או לא תקינים: ${miss.join(', ')}.</div>`:''}</div>
  ${role==='inv'?`<div class="notice bad"><label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" id="c-risk" data-b="d:${d.id}.c.riskAck" ${c.riskAck?'checked':''} style="margin-top:4px;width:18px;height:18px;flex:none">
    <span><b>אתה עלול לאבד את כל ההשקעה.</b><br>חלוקה ברווחים היא חלוקה בסיכונים. ההחזר הראשון יגיע לכל המוקדם אחרי הדוח השנתי הראשון, ואין אפשרות יציאה. אני מאשר/ת שקראתי והבנתי.</span></label></div>`:''}
  <div class="card"><h3>חתימות</h3>
   <div class="sig"><span>בעל העסק</span>${c.sigbiz?chip('חתם','ok'):chip('ממתין','warn')}</div>
   <div class="sig"><span>המשקיע</span>${c.siginv?chip('חתם','ok'):chip('ממתין','warn')}</div>
   <button class="btn pri" data-act="sign" ${canSign?'':'disabled'}>${c['sig'+role]?'חתמת על החוזה':`חתום כ${RL[role]}`}</button>
   ${needRisk&&!miss.length?'<p class="tiny muted">יש לאשר את אזהרת הסיכון כדי לחתום.</p>':''}
   ${c['sig'+other(role)]?'':`<button class="btn demo" data-act="demoSign">דמו: ${RL[other(role)]} חותם</button>`}</div>`;
}
function payBody(d,role){
  const t=d.terms,f=fee(t.amount);
  return`<div class="notice warn">סביבת בדיקות. אין כסף אמיתי. בהפעלה אמיתית ההעברה תעבור דרך ספק תשלומים או נאמנות מורשה, אחרי בדיקה משפטית.</div>
  <div class="card"><h3>הפקדה והעברה</h3>
   <table><tr><td>סכום ההשקעה</td><td class="num"><b>${fmt(t.amount)}</b></td></tr>
   <tr><td>עמלת פלטפורמה 0.8% (משולמת על ידי בעל העסק)</td><td class="num"><b>${fmt(f)}</b></td></tr>
   <tr><td>הסכום נטו שמגיע לעסק</td><td class="num"><b>${fmt(t.amount-f)}</b></td></tr></table>
   <p class="tiny muted">הכסף עובר רק אחרי חתימה של שני הצדדים. העסקה נחשבת סגורה כשהחוזה חתום והכסף הופקד.</p>
   ${role==='inv'?`<button class="btn pri" id="payBtn" data-act="pay">הפקד ${fmt(t.amount)} דרך ספק התשלומים (דמו)</button>`
   :`<div class="notice">ממתין להפקדת המשקיע.</div><button class="btn demo" data-act="demoPay">דמו: המשקיע מפקיד</button>`}</div>`;
}
function dueDate(d,n){const x=new Date(d.startAt);x.setFullYear(x.getFullYear()+n);x.setDate(x.getDate()+90);return x}
function closedBody(d,role){
  const t=d.terms,f=fee(t.amount),n=d.reports.length+1,due=n<=t.term&&d.simYear>=n;
  const sched=Array.from({length:t.term},(_,i)=>{const y=i+1,r=d.reports[i];
    return`<tr><td>שנה ${y}</td><td class="num">${fmtDate(dueDate(d,y))}</td><td>${r?`${chip('שולם','ok')}<div class="num small">${fmt(r.share)}</div>`:(y===n&&due?chip('הדוח מחכה','warn'):chip('ממתין לדוח'))}</td></tr>`}).join('');
  const reps=d.reports.map((r,i)=>`<div class="card flat"><div class="row"><b>דוח שנה ${r.year}</b>${r.audit?chip('נשלחה בקשת בדיקה','warn'):''}</div>
    <div class="small num">רווח חוזי: ${fmt(r.con)} · חלק המשקיע (${t.pct}%): <b>${fmt(r.share)}</b></div>
    ${r.expl?`<div class="tiny muted">הסבר העסק לירידה ברווח: ${esc(r.expl)}</div>`:''}
    ${role==='inv'&&!r.audit?`<button class="btn" data-act="audit" data-arg="${i}">בקש בדיקת רו״ח מטעמי</button>`:''}</div>`).join('');
  return`<div class="notice ok">העסקה נסגרה: החוזה נחתם והכסף הופקד.</div>
  <div class="card"><h3>${role==='inv'?'סטטוס ההשקעה':'סטטוס העסקה'}</h3>
   <div class="stats"><div class="stat"><span>הופקד</span><b class="num">${fmt(t.amount)}</b></div><div class="stat"><span>${role==='biz'?'נטו אחרי עמלה':'עמלה (משולמת מהעסק)'}</span><b class="num">${fmt(role==='biz'?t.amount-f:f)}</b></div>
   <div class="stat"><span>אחוז מהרווח החוזי</span><b class="num">${t.pct}%</b></div><div class="stat"><span>תקופה · דיווח</span><b>${t.term} שנים · ${esc(d.c.freq)}</b></div></div>
   <div class="notice acc">החזר ראשון צפוי לכל המוקדם: <b>${fmtDate(dueDate(d,1))}</b>, אחרי הדוח השנתי הראשון.${role==='inv'?' עד אז אין נתונים על העסק, אלא אם הצדדים הסכימו על דוחות ביניים.':''}</div></div>
  <div class="card"><h3>לוח החזרים</h3><div class="scroll-x"><table><tr><th>שנה</th><th>מועד הגשה</th><th>סטטוס</th></tr>${sched}</table></div></div>
  ${reps}
  ${role==='biz'?reportForm(d,n,due):''}
  <button class="btn demo" data-act="year" ${d.simYear>=t.term?'disabled':''}>דמו: קדם שנה בחוזה (עכשיו שנה ${d.simYear})</button>
  <p class="tiny muted">העסק לא משלם? בגרסה הראשונה צוות הפלטפורמה מטפל בכך ידנית. סוכן AI לסכסוכים ייבנה בשלב מאוחר יותר.</p>`;
}
function reportForm(d,n,due){
  if(n>d.terms.term)return`<div class="notice">כל הדוחות הוגשו.</div>`;
  if(!due)return`<div class="notice">הדוח השנתי הראשון יוגש אחרי תום שנה. תקבלו תזכורת לפני המועד.</div>`;
  const r=S.rf,con=num(r.pre)+num(r.a)+num(r.b)+num(r.c)+num(r.d),share=Math.max(0,con)*d.terms.pct/100;
  const prev=d.reports.length?d.reports[d.reports.length-1].con:null,drop=prev!=null&&prev>0&&con<prev*DROP;
  const ok=r.pre!==''&&r.file&&r.ack&&(!drop||r.expl.trim());
  return`<div class="card"><div class="row"><h3>דוח שנתי: שנה ${n}</h3>${chip('תזכורת: עד '+fmtDate(dueDate(d,n)),'warn')}</div>
   <div class="row small"><span>${r.file?esc(r.file):'לא הועלה דוח רווח והפסד מאושר'}</span></div>
   <div class="btns"><label class="btn" style="cursor:pointer">העלאת דוח<input type="file" data-file="rf" style="display:none"></label><button class="btn demo" data-act="repDemo">קובץ לדוגמה</button></div>
   ${field('רווח לפני מס לפי הדוח (₪)','r-pre','rf.pre',r.pre,{num:1,req:1})}
   <div class="small muted" style="font-weight:600">התאמות לרווח החוזי</div>
   ${field('(א) שכר בעלים מעל המוסכם','r-a','rf.a',r.a,{num:1})}${field('(ב) הוצאות פרטיות','r-b','rf.b',r.b,{num:1})}
   ${field('(ג) תשלומים לצדדים קשורים מעל מחיר שוק','r-c','rf.c',r.c,{num:1})}${field('(ד) החזרי הלוואות בעלים','r-d','rf.d',r.d,{num:1})}
   <div class="notice acc num">רווח חוזי: <b>${fmt(con)}</b><br>חלק המשקיע (${d.terms.pct}%): <b>${fmt(share)}</b></div>
   ${drop?`<div class="notice warn">הרווח ירד בחדות לעומת שנה קודמת. נדרש הסבר כתוב לפני תשלום ההחזר.</div>${field('הסבר לירידה ברווח','r-expl','rf.expl',r.expl,{area:1,req:1})}`:''}
   <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px"><input type="checkbox" id="r-ack" data-b="rf.ack" ${r.ack?'checked':''} style="margin-top:3px"><span>הנתון זהה לנתון שהוגש לרשות המסים.</span></label>
   <button class="btn pri" data-act="report" ${ok?'':'disabled'}>הגש דוח וחשב החזר</button></div>`;
}

/* ---------- shell ---------- */
function currentView(){
  const role=S.role,isBiz=role==='biz';
  if(isBiz&&S.biz.onb<2)return{v:onboardView(),tabs:false};
  if(!isBiz&&S.inv.onb<2)return{v:onboardView(),tabs:false};
  if(S.screen){const d=deal(S.screen.deal);if(d)return{v:dealView(d),tabs:true}}
  const t=isBiz?S.tabBiz:S.tabInv;
  let v;
  if(isBiz)v=t==='profile'?bizProfileView():t==='leads'?leadsView():dealsListView('biz');
  else v=t==='feed'?feedView():t==='mine'?dealsListView('inv'):invProfileView();
  return{v,tabs:true};
}
function tabsHtml(){
  const isBiz=S.role==='biz',cur=isBiz?S.tabBiz:S.tabInv;
  const cnt=isBiz?myDeals('biz').filter(d=>d.status==='interested').length:0;
  const list=isBiz?[['profile','פרופיל'],['leads','מתעניינים'+(cnt?`<span class="badge">${cnt}</span>`:'')],['deals','עסקאות']]:[['feed','גילוי'],['mine','העסקאות שלי'],['profile','פרופיל']];
  return`<nav class="tabs" aria-label="ניווט ראשי">${list.map(([k,l])=>`<button data-act="tab" data-arg="${k}" ${!S.screen&&cur===k?'aria-current="page"':''}>${l}</button>`).join('')}</nav>`;
}
function funnel(){
  const swipes=Object.keys(S.swipes).length+S.deals.filter(d=>d.invId!=='meInv').length;
  const match=S.deals.filter(d=>d.matched).length,neg=S.deals.filter(d=>d.negot).length,signed=S.deals.filter(d=>d.status==='signed'||d.status==='closed').length,dep=S.deals.filter(d=>d.status==='closed').length;
  const rows=[['החלקה',swipes],['התאמה',match],['משא ומתן',neg],['חוזה חתום',signed],['עסקה (הופקד)',dep]],mx=Math.max(1,swipes);
  const pct=(a,b)=>b?Math.round(a/b*100)+'%':'אין נתונים';
  return`<div class="card"><h3>מסלול העסקה (נתוני הדמו)</h3><div class="funnel">${rows.map(([l,n])=>`<div class="fbar"><span>${l}</span><span class="t"><i style="width:${n/mx*100}%"></i></span><b>${n}</b></div>`).join('')}</div>
   <div class="scroll-x"><table><tr><th>מדד</th><th>בדמו</th><th>יעד ראשוני</th></tr>
   <tr><td>התאמה שהופכת למשא ומתן</td><td class="num">${pct(neg,match)}</td><td>50%</td></tr>
   <tr><td>התאמה שהופכת לעסקה</td><td class="num">${pct(dep,match)}</td><td>5%–10% ב־3 חודשים</td></tr>
   <tr><td>זמן מהתאמה לחתימה</td><td>—</td><td>עד 14 ימים</td></tr>
   <tr><td>דוחות שנתיים בזמן</td><td>—</td><td>90%</td></tr></table></div>
   <p class="tiny muted">היעדים הם השערות עבודה לכיול אחרי שלב האימות.</p></div>`;
}
function sidePanel(){
  return funnel()+`
  <div class="card"><h3>המודל בקצרה</h3><ul class="clean small">
   <li>המשקיע נותן סכום קבוע (כ־20,000–25,000 ₪) ומקבל אחוז קבוע מהרווח החוזי השנתי של העסק כולו, עד 10 שנים, בלי בעלות.</li>
   <li>עמלה של 0.8% מסכום ההשקעה, משולמת על ידי בעל העסק (20,000 ₪ ← 160 ₪).</li>
   <li>הכסף עובר רק אחרי חתימת שני הצדדים. ההחזר הראשון רק אחרי הדוח השנתי הראשון.</li>
   <li>ללא פיצוי כברירת מחדל. אזהרת סיכון מפורשת לפני חתימה.</li></ul></div>
  <details class="card"><summary>מה מחוץ לגרסה הראשונה</summary><ul class="clean small">
   <li>סוכן AI לסכסוכים (כרגע טיפול ידני של הצוות)</li><li>ערבות בנקאית מבעל העסק (גרסה הבאה)</li>
   <li>אימות מתקדם: רשות המסים, רשם החברות, קופה</li><li>פיצול סכום בין כמה משקיעים</li><li>שוק משני, דירוגים וביקורות, חוזים מותאמים</li></ul></details>
  <div class="notice warn small">דורש בדיקה משפטית לפני כסף אמיתי: רישוי, הלבנת הון, ניכוי מס, אישור תבנית החוזה והגדרת הרווח החוזי.</div>`;
}
function render(){
  const ph=$('#phone'),scr=ph.querySelector('.screen'),top=scr&&keepScroll?scr.scrollTop:0;
  const a=document.activeElement,fid=a&&a.id&&ph.contains(a)?a.id:null;
  let ss=null,se=null;if(fid&&a.setSelectionRange){try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}}
  const{v,tabs}=currentView();
  ph.innerHTML=`<div class="ph-head"><h2>${v.title}</h2>${chip(S.role==='biz'?'בעל עסק':'משקיע','acc')}</div><div class="demo-banner">גרסת דמו · נתוני דוגמה · ללא כסף אמיתי</div>
    <main class="screen">${v.body}</main>${tabs?tabsHtml():''}`;
  const ns=ph.querySelector('.screen');if(ns)ns.scrollTop=top;
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(ss!=null&&el.setSelectionRange){try{el.setSelectionRange(ss,se)}catch(e){}}}}
  $('#side').innerHTML=sidePanel();
  $('#roleBiz').setAttribute('aria-pressed',S.role==='biz');$('#roleInv').setAttribute('aria-pressed',S.role==='inv');
  keepScroll=true;save();wireSwipe();
}
render();
</script>
